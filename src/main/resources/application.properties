spring.application.name=fitkart-backend

# ==========================
# MySQL Database Configuration
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/fitkart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Server
# ==========================
server.port=8080

# ==========================
# JWT Configuration
# ==========================
jwt.secret=${JWT_SECRET:FitKartSuperSecretKeyForJWTAuthentication2026Secure}
jwt.expiration=86400000

# ==========================
# Product Image Storage
# ==========================
file.upload-dir=uploads/products

# ==========================
# Product Image Upload Limits
# ==========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
